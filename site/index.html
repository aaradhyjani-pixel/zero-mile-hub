<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Zero Mile Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* A night-console around a live airfield: KPI strip on top, runway desk and incidents on the right, the bank chart along the bottom.
   The game has one look on purpose: an ops room console. Tokens are defined once and repeated for both schemes. */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  color-scheme: dark;
  --night:#090c0e;
  --panel:rgba(10,13,16,.94);
  --panel-2:#0e1316;
  --panel-edge:#26313a;
  --ink:#ece7da;
  --ink-2:#a6afb4;
  --ink-3:#6f7a80;
  --sign:#f4c430;
  --sign-ink:#121212;
  --go:#3ad07f;
  --stop:#ff4d3f;
  --warn:#ffae3b;
  --arr:#8a7cff;
  --dep:#2fd3c6;
  --mix:#f4c430;
  --cool:#6aa3ff;
  --f-sign:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:352px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}#map.point{cursor:pointer}
.hud{position:absolute;z-index:5}
.panel{background:var(--panel);border:1px solid var(--panel-edge);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,.term:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.term{color:var(--sign);border-bottom:1px dotted rgba(244,196,48,.6);cursor:help}
.dirsign{display:inline-block;background:var(--sign);color:var(--sign-ink);font-family:var(--f-sign);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:12px;padding:1px 7px;border-radius:2px}

/* top strip */
#top{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:calc(var(--rail) + 24px);padding:7px 10px;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.lvl{display:flex;flex-direction:column;line-height:1.15}
.lvl .code{font-family:var(--f-sign);font-weight:700;letter-spacing:.06em;font-size:13px;color:var(--sign)}
.lvl .nm{font-family:var(--f-sign);font-weight:600;font-size:16px;white-space:nowrap}
#clock{font-family:var(--f-mono);font-weight:500;font-size:30px;line-height:1;letter-spacing:-.02em}
#left{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.speeds{display:flex;gap:3px}
.speeds button{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border:1px solid var(--panel-edge);border-radius:4px;color:var(--ink-2)}
.speeds button.on{background:var(--ink);color:#0a0d0f;border-color:var(--ink)}
.speeds button:hover:not(.on){border-color:var(--ink-3);color:var(--ink)}
#kpis{display:flex;gap:4px;flex:1;min-width:0;justify-content:flex-end;flex-wrap:wrap}
.kpi{min-width:70px;padding:3px 8px 4px;border-left:1px solid var(--panel-edge);cursor:help}
.kpi .k{font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.kpi .v{font-family:var(--f-mono);font-size:17px;font-weight:500;line-height:1.15;white-space:nowrap}
.kpi .v small{font-size:11px;color:var(--ink-3);font-weight:400}
.kpi.good .v{color:var(--go)}.kpi.mid .v{color:var(--warn)}.kpi.bad .v{color:var(--stop)}
#ticker{width:100%;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--panel-edge);padding-top:5px}
#ticker .src{color:var(--sign)}

/* bank chart */
#wave{left:max(12px,env(safe-area-inset-left,0px));right:calc(var(--rail) + 24px);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px 10px 6px;display:flex;flex-direction:column;gap:3px}
.whead{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.whead b{font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;color:var(--ink)}
.lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg s{width:14px;height:0;border-top:2px dashed currentColor;display:inline-block;text-decoration:none}
#wCounts{margin-left:auto;font-family:var(--f-mono);font-size:11.5px}
#wcv{width:100%;height:132px;display:block}

/* right rail */
#rail{position:absolute;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:var(--rail);display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rail>*{pointer-events:auto}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px 5px;font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;border-bottom:1px solid var(--panel-edge)}
.ph span{font-family:var(--f-mono);font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:400}
#rwys{flex:none}
.rw{display:grid;grid-template-columns:62px 1fr;gap:2px 8px;padding:6px 10px;border-bottom:1px solid #151c21;align-items:center}
.rw:last-child{border-bottom:0}
.rw .nm{font-family:var(--f-mono);font-size:13px;font-weight:500;line-height:1.1}
.rw .nm small{display:block;font-size:10px;color:var(--ink-3);font-weight:400}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.seg button{font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;font-size:12px;padding:3px 0;border:1px solid var(--panel-edge);border-radius:3px;color:var(--ink-3)}
.seg button:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.seg button.on[data-m="ARR"]{background:var(--arr);border-color:var(--arr);color:#0b0b0b}
.seg button.on[data-m="DEP"]{background:var(--dep);border-color:var(--dep);color:#0b0b0b}
.seg button.on[data-m="MIX"]{background:var(--mix);border-color:var(--mix);color:#0b0b0b}
.seg button.on[data-m="OFF"]{background:#3a434a;border-color:#3a434a;color:var(--ink)}
.seg button:disabled{opacity:.25;cursor:default}
.rw .st{grid-column:2;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .st b{font-weight:500;color:var(--ink-2)}.rw .st .hot{color:var(--warn)}.rw .st .bad{color:var(--stop)}
.rw.locked{opacity:.42}
.rw.sel{background:#141b20}
#incs{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;max-height:44%}
#incList{overflow:auto;min-height:0}
#incList:empty::after{content:"Nothing needs you. The ops teams have the routine. Watch the bank chart and get the runways ready for the next wave.";display:block;padding:9px 10px;color:var(--ink-3);font-size:12.5px}
.inc{display:grid;grid-template-columns:30px 1fr;gap:2px 9px;padding:7px 10px;border-bottom:1px solid #151c21;animation:incin .3s ease-out}
@keyframes incin{from{background:#2a2312}to{background:transparent}}
.inc .ic{grid-row:span 3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-sign);font-weight:700;font-size:13px;color:#0b0b0b}
.inc h4{margin:0;font-family:var(--f-sign);font-weight:600;font-size:15px;line-height:1.15;cursor:pointer}
.inc p{margin:0;color:var(--ink-2);font-size:12px}
.inc .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.acts button{padding:3px 9px;border:1px solid var(--panel-edge);border-radius:3px;font-size:12px;font-weight:600;background:#11171b}
.acts button:hover:not(:disabled){border-color:var(--sign)}
.acts button.pri{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.acts button:disabled{opacity:.35;cursor:not-allowed}
.inc .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.inc>*:not(.ic){grid-column:2}
.inc .dflt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
#toast.alarm{border-color:var(--stop);box-shadow:0 0 0 2px var(--stop),0 10px 30px rgba(0,0,0,.5)}
#toast.alarm .dirsign{background:var(--stop);color:#fff}
.cfgrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:12px 0 2px;font-size:13px}
.cfgrow b{font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px}
.cfgrow small{color:var(--ink-3);font-size:12.5px}
.seg2{display:inline-flex;gap:3px}
.seg2 button{border:1px solid var(--panel-edge);border-radius:3px;padding:4px 11px;font-family:var(--f-sign);font-weight:600;letter-spacing:.04em;font-size:13.5px;color:var(--ink-3)}
.seg2 button.on{background:var(--ink);color:#0a0d0f;border-color:var(--ink)}
.inc .tm i{display:inline-block;height:3px;background:var(--stop);vertical-align:middle;margin-left:6px;border-radius:2px}
#tabs{flex:1 1 0;min-height:110px;display:flex;flex-direction:column;overflow:hidden}
.tabbar{display:flex;border-bottom:1px solid var(--panel-edge);flex:none}
.tabbar button{flex:1;padding:7px 0 6px;font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent}
.tabbar button.on{color:var(--ink);border-bottom-color:var(--sign)}
.tabbar .c{font-family:var(--f-mono);font-size:10.5px;color:var(--stop);margin-left:4px}
.tabbody{flex:1;min-height:0;overflow:auto}
table.board{width:100%;border-collapse:collapse;font-size:12px}
.board th{position:sticky;top:0;background:#0d1114;text-align:left;font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:10.5px;color:var(--ink-3);padding:5px 6px;border-bottom:1px solid var(--panel-edge)}
.board td{padding:4px 6px;border-bottom:1px solid #151c21;white-space:nowrap}
.board tr[data-id]{cursor:pointer}
.board tr[data-id]:hover td{background:#141b20}
.board .f{font-family:var(--f-mono)}.board .sub{color:var(--ink-3);font-size:11px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:3px;line-height:16px;white-space:nowrap}
#coachList{padding:8px 10px;display:flex;flex-direction:column;gap:10px}
#coachList .ci h4{margin:0 0 2px;font-family:var(--f-sign);font-weight:600;font-size:16px}
#coachList .ci p{margin:0;color:var(--ink-2);font-size:12.5px}
#coachList .ci .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
#gloss{padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px}
#gloss button{font-size:12px;border:1px solid var(--panel-edge);border-radius:3px;padding:2px 7px;color:var(--ink-2)}
#gloss button:hover{border-color:var(--sign);color:var(--ink)}

/* coach toast and popovers */
#toast{right:calc(var(--rail) + 24px);width:380px;max-width:calc(100% - var(--rail) - 48px);padding:0;overflow:hidden}
#toast[hidden]{display:none}
#toast header{display:flex;justify-content:space-between;align-items:center;padding:7px 8px 0 12px}
.x{width:24px;height:22px;border-radius:3px;color:var(--ink-3);font-size:16px}
.x:hover{background:#1a2228;color:var(--ink)}
#toast .cbody{padding:4px 12px 11px}
#toast h4{margin:0 0 4px;font-family:var(--f-sign);font-weight:600;font-size:18px;line-height:1.15}
#toast p{margin:0 0 6px;color:var(--ink-2);font-size:13px}
#toast svg{display:block;margin:6px 0 4px}
#toast.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--sign),0 10px 30px rgba(0,0,0,.5)}100%{box-shadow:0 0 0 0 transparent,0 10px 30px rgba(0,0,0,.5)}}
#pop{position:absolute;z-index:9;width:272px;padding:9px 11px 10px}
#pop[hidden]{display:none}
#pop h4{margin:0 0 3px;font-family:var(--f-sign);font-weight:600;font-size:17px;line-height:1.15;padding-right:22px}
#pop p{margin:0 0 7px;color:var(--ink-2);font-size:12.5px}
#pop .x{position:absolute;top:6px;right:6px}
#pop .seg{margin:4px 0 2px}
#pop dl{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;margin:4px 0 7px;font-size:12.5px}
#pop dt{color:var(--ink-3)}#pop dd{margin:0}

/* overlay sheets */
#overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(3,5,7,.6),rgba(3,5,7,.88))}
#overlay[hidden]{display:none!important}
.sheet{background:#0a0e11;border:1px solid var(--panel-edge);border-radius:8px;max-width:1040px;width:100%;max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.sheet .band{background:var(--sign);color:var(--sign-ink);padding:8px 20px;font-family:var(--f-sign);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;display:flex;justify-content:space-between;gap:12px}
.sheet .in{padding:20px 24px 24px}
.sheet h1{font-family:var(--f-sign);font-weight:700;font-size:54px;line-height:.95;margin:0 0 10px;text-wrap:balance}
.sheet h2{font-family:var(--f-sign);font-weight:600;font-size:22px;margin:20px 0 6px}
.sheet p{color:var(--ink-2);max-width:72ch;margin:0 0 9px;font-size:14.5px}
.sheet ul{margin:0 0 6px;padding-left:18px;color:var(--ink-2);font-size:14px}
.sheet li{margin-bottom:3px}
.sheet .src{font-size:12px;color:var(--ink-3)}.sheet .src a{color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 6px}
.facts>div{border:1px solid var(--panel-edge);border-radius:5px;padding:8px 10px}
.facts .v{font-family:var(--f-mono);font-size:21px}
.facts .k{font-size:12px;color:var(--ink-3)}
.plan{border:1px solid var(--panel-edge);border-radius:6px;overflow:hidden;background:#0f1417;margin:10px 0}
.plan svg{display:block;width:100%;height:auto}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin:10px 0}
.lc{border:1px solid var(--panel-edge);border-radius:6px;padding:12px 12px 12px;display:flex;flex-direction:column;gap:6px;background:#0d1215;text-align:left}
.lc:hover:not(:disabled){border-color:var(--sign)}
.lc:disabled{opacity:.4;cursor:not-allowed}
.lc .n{font-family:var(--f-sign);font-weight:700;letter-spacing:.06em;font-size:12.5px;color:var(--sign)}
.lc h3{margin:0;font-family:var(--f-sign);font-weight:600;font-size:21px;line-height:1.05}
.lc p{margin:0;font-size:12.5px;color:var(--ink-2)}
.lc .meta{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.stars{font-size:18px;letter-spacing:2px;color:#3a434a}.stars b{color:var(--sign);font-weight:400}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--panel-edge);margin:0 0 12px}
.tabs2 button{padding:8px 14px 7px;font-family:var(--f-sign);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--sign)}
.go{margin-top:12px;background:var(--sign);color:var(--sign-ink);font-family:var(--f-sign);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:18px;padding:11px 22px;border-radius:4px}
.go.ghost{background:none;color:var(--ink);border:1px solid var(--panel-edge)}
.go:hover{filter:brightness(1.08)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:12px 0 6px}
.score>div{border:1px solid var(--panel-edge);border-radius:5px;padding:8px 10px}
.score .k{font-family:var(--f-sign);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--ink-3)}
.score .v{font-family:var(--f-mono);font-size:21px}
.score .sub{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-top:2px}
.bigstars{font-size:54px;letter-spacing:6px;color:#2a3238;line-height:1}.bigstars b{color:var(--sign);font-weight:400}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--panel-edge);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
#zoomBox{display:flex;gap:2px;padding:3px;z-index:6}
#zoomBox button{min-width:30px;height:28px;padding:0 8px;border:1px solid var(--panel-edge);border-radius:4px;font-family:var(--f-mono);font-size:15px;color:var(--ink)}
#zoomBox button:hover{border-color:var(--sign)}
#zoomBox button:last-child{font-size:12px}
@media (max-width:980px){
  :root,:root[data-theme="light"],:root[data-theme="dark"]{--rail:100%}
  #top{right:max(12px,env(safe-area-inset-right,0px))}
  #ticker{display:none}
  #rail{top:auto;left:max(12px,env(safe-area-inset-left,0px));width:auto;height:44%}
  #tabs,#wave{display:none}
  #toast{display:none!important}
  .sheet h1{font-size:38px}
}
@media (prefers-reduced-motion:reduce){.inc,#toast.flash{animation:none}}
</style>

<div id="app">
  <div id="zoomBox" class="hud panel" role="group" aria-label="Map zoom"><button id="zIn" title="Zoom in (+)">+</button><button id="zOut" title="Zoom out (−)">−</button><button id="zFit" title="Show the whole airport (F)">Fit</button></div>
  <canvas id="map" aria-label="Live map of the hub: six parallel runways, the terminal and concourses, and every aircraft"></canvas>

  <header id="top" class="hud panel">
    <div class="lvl"><span class="code" id="lvCode">LEVEL 1</span><span class="nm" id="lvName">Opening day</span></div>
    <div><div id="clock">06:00</div><div id="left">90 min left</div></div>
    <div class="speeds" role="group" aria-label="Simulation speed">
      <button id="spP" data-s="0" title="Pause (space)">Pause</button>
      <button data-s="1" class="on" title="1 real second = 20 airport seconds">1×</button>
      <button data-s="2">2×</button>
      <button data-s="4">4×</button>
    </div>
    <div id="kpis">
      <div class="kpi" id="kMov" title="Take-offs and landings so far, against this level's target."><div class="k">Movements</div><div class="v">0</div></div>
      <div class="kpi" id="kRate" title="Movements in the last 30 minutes, scaled to an hour. This is the number the world record is measured in."><div class="k">Per hour</div><div class="v">0</div></div>
      <div class="kpi" id="kOtp" title="On time: share of flights that ran to schedule. Arrivals: landed within 15 minutes of schedule, so holding counts against you. Departures: airborne within 25 minutes of scheduled pushback."><div class="k">On time</div><div class="v">—</div></div>
      <div class="kpi" id="kCnx" title="Connections: share of transfer passengers who reached their next flight before it pushed back."><div class="k">Connections</div><div class="v">—</div></div>
      <div class="kpi" id="kSafe" title="Safety. Drops when an incident goes wrong. Below 70 the level fails."><div class="k">Safety</div><div class="v">100</div></div>
    </div>
    <div id="ticker"><span class="src">AOCC</span> Hub control is yours.</div>
  </header>

  <section id="wave" class="hud panel" aria-label="Bank chart: scheduled arrivals and departures against runway capacity">
    <div class="whead">
      <b>Bank chart</b>
      <span class="lg"><i style="background:var(--arr)"></i>Arrivals due</span>
      <span class="lg"><i style="background:var(--dep)"></i>Departures due</span>
      <span class="lg" style="color:var(--arr)"><s></s>Landing capacity</span>
      <span class="lg" style="color:var(--dep)"><s></s>Take-off capacity</span>
      <span id="wCounts"></span>
    </div>

<script>window.__DESIGN={html:"<div class=\"facts\"><div><div class=\"v\">3 \u2192 1<\/div><div class=\"k\">Ahmedabad, Mumbai and Bengaluru airports merged into one<\/div><\/div><div><div class=\"v\">6<\/div><div class=\"k\">parallel runways, spaced so any of them can land independently<\/div><\/div><div><div class=\"v\">304<\/div><div class=\"k\">stands, 56 of them MARS: one widebody or two narrowbodies<\/div><\/div><div><div class=\"v\">\u2264 660 m<\/div><div class=\"k\">from the train to the farthest gate<\/div><\/div><div><div class=\"v\">0<\/div><div class=\"k\">runway crossings on the way to a gate<\/div><\/div><\/div>\n<div class=\"two\"><div>\n<h2>Three cities, one roof<\/h2>\n<p>ZMI is not a new airport with three themed zones. It is one building whose parts each come from one of the three airports that closed to make it. Its <b>structure<\/b> is Mumbai's: branching columns that flare into a ceiling of coffers, each coffer a skylight with a coloured lens, and a 40 m cantilever over the kerb, as at Mumbai's Terminal 2. Its <b>underside<\/b> is Bengaluru's: bamboo-clad soffits, hanging gardens, a planted valley where the Hall becomes the Mall, and a garden court at every pier root, after Bengaluru's terminal in a garden. Its <b>edges<\/b> are Ahmedabad's: jaali screens shading every sun-facing glass wall, and a forecourt that steps down like a stepwell to shaded water.<\/p>\n<h2>Each gateway points home<\/h2>\n<p>The Zero Mile Hall keeps its seven lobes, like the segments of a Nagpur orange, but turns so one lobe flows due east into the Mall. The three lobes facing the city then point within 8\u00b0 of the airports they replace: south to Bengaluru, west-south-west to Mumbai, west-north-west to Ahmedabad. Each is that city's check-in hall, in its materials and art. Their axes meet under the oculus at the Zero Mile marker, where a floor inlay recalls Sardar Patel bringing more than 560 princely states into one India. The two western lobes also frame the year's sunsets, 245\u00b0 in December to 295\u00b0 in June, so the hardest sun lands on the jaali, not the glass.<\/p>\n<h2>Runways<\/h2>\n<p>Six east-west runways in two triples either side of a 3.6 km midfield. Middle to inner runways are 1,035 m apart, the ICAO minimum for independent approaches with modern surveillance, so the runway desk can turn any runway to arrivals. Outer to middle is 1,550 m. By default three land and three take off. The 4,500 m inner runway handles heavy jets on 47 \u00b0C afternoons: ICAO's heat and height corrections take a 777-300ER's 3.1 km sea-level take-off to about 4.3 km here.<\/p>\n<\/div><div>\n<h2>Taxiing in loops<\/h2>\n<p>End-around taxiways at both ends mean no aircraft crosses a runway. Taxiways are one-way loops: the outer parallels run west, and the midfield has two parallels, west by the runway and east by the terminal, so nobody meets head-on. A widebody exit set sits beyond the narrowbody rapid exits. Holding bays take aircraft whose stand isn't free yet, and a heat pad by the long runway lets heavy jets step aside.<\/p>\n<h2>Heat first<\/h2>\n<p>Every skylight is a north-facing coffer: daylight without direct summer sun. They cover about 5.5% of the roof, against about 12% at Bengaluru's T2, because Nagpur reaches 47.9 \u00b0C. Deep overhangs and jaali on the east and west faces, a heavy stone floor, cool air delivered low and drawn out high, and the roof's valleys collect about 1.45 million m\u00b3 of monsoon rain a year (estimates).<\/p>\n<h2>Transfers and phasing<\/h2>\n<p>Airlines live in neighbourhoods, so most domestic connections stay within one concourse pair: about 7 to 11 minutes door to door. International to domestic runs through a transfer centre with immigration and re-screening: about 25 minutes. The people mover runs every 90 seconds under the Mall. Bengaluru moves in first, then Ahmedabad with Hyderabad's banks, then Mumbai, then Delhi's banks: the game's four levels. Phase 2 adds two satellites on the east apron for 260 million passengers.<\/p>\n<\/div><\/div>\n<div class=\"plan\" style=\"margin-top:14px\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Roof plan of the Zero Mile Hall, the Mall and concourses A and B: one continuous roof with north-light coffers, branching tree columns, gardens in the valleys, jaali screens on the sun-facing walls, an oculus over the Zero Mile marker and a 40 m cantilever over the stepwell forecourt.\">\n<defs><linearGradient id=\"rg\" gradientUnits=\"userSpaceOnUse\" x1=\"-2950\" y1=\"-650\" x2=\"-900\" y2=\"650\"><stop offset=\"0\" stop-color=\"#f7eedb\"/><stop offset=\".5\" stop-color=\"#eee2c4\"/><stop offset=\"1\" stop-color=\"#dccaa2\"/><\/linearGradient><clipPath id=\"cl\"><rect x=\"-4000\" y=\"-2000\" width=\"3070\" height=\"4000\"/><\/clipPath><linearGradient id=\"fd\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#0f1417\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#0f1417\"/><\/linearGradient><\/defs>\n<rect width=\"1600\" height=\"900\" fill=\"#0f1417\"/>\n<g transform=\"translate(1268.80 450) scale(0.38)\" clip-path=\"url(#cl)\">\n<rect x=\"-3060\" y=\"-170\" width=\"250\" height=\"340\" rx=\"40\" fill=\"#b8925f\" fill-opacity=\"0.35\" stroke=\"#e0bf8f\" stroke-width=\"3\"/>\n<rect x=\"-3038\" y=\"-148\" width=\"206\" height=\"296\" rx=\"18\" fill=\"#b8925f\" fill-opacity=\"0.48\" stroke=\"#e0bf8f\" stroke-width=\"3\"/>\n<rect x=\"-3016\" y=\"-126\" width=\"162\" height=\"252\" rx=\"6\" fill=\"#b8925f\" fill-opacity=\"0.61\" stroke=\"#e0bf8f\" stroke-width=\"3\"/>\n<rect x=\"-2994\" y=\"-104\" width=\"118\" height=\"208\" rx=\"6\" fill=\"#b8925f\" fill-opacity=\"0.74\" stroke=\"#e0bf8f\" stroke-width=\"3\"/>\n<rect x=\"-2972\" y=\"-82\" width=\"74\" height=\"164\" rx=\"6\" fill=\"#b8925f\" fill-opacity=\"0.87\" stroke=\"#e0bf8f\" stroke-width=\"3\"/>\n<rect x=\"-2970.0\" y=\"-70.0\" width=\"70\" height=\"140\" rx=\"6\" fill=\"#5fb7d9\"/>\n<path d=\"M-2642 330 L-27 THE HALL, THE MALL AND PIERS A AND B<\/text>\n<text x=\"30\" y=\"80\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"17\">Roof plan. Structure from Mumbai, underside and gardens from Bengaluru, edges from Ahmedabad.<\/text>\n<path d=\"M40 766 L40 750 L129 515\" stroke=\"#d9894a\" stroke-width=\"1.6\" fill=\"none\"/><circle cx=\"129\" cy=\"515\" r=\"4\" fill=\"#d9894a\"/>\n<text x=\"30\" y=\"790\" fill=\"#d9894a\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"20\" font-weight=\"700\" letter-spacing=\"1\">AHMEDABAD \u00b7 EDGES<\/text>\n<text x=\"30\" y=\"814\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Jaali screens on the sun-facing walls<\/text>\n<text x=\"30\" y=\"835\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">(tree-of-life pattern on the west lobe);<\/text>\n<text x=\"30\" y=\"856\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">the stepwell forecourt in the west valley.<\/text>\n<path d=\"M350 766 L350 750 L535 494\" stroke=\"#6fbf73\" stroke-width=\"1.6\" fill=\"none\"/><circle cx=\"535\" cy=\"494\" r=\"4\" fill=\"#6fbf73\"/>\n<text x=\"340\" y=\"790\" fill=\"#6fbf73\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"20\" font-weight=\"700\" letter-spacing=\"1\">BENGALURU \u00b7 UNDERSIDE<\/text>\n<text x=\"340\" y=\"814\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Bamboo soffits and hanging gardens;<\/text>\n<text x=\"340\" y=\"835\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">the garden valley where the Hall<\/text>\n<text x=\"340\" y=\"856\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">becomes the Mall; courts at pier roots.<\/text>\n<path d=\"M660 766 L660 750 L843 627\" stroke=\"#e8b04a\" stroke-width=\"1.6\" fill=\"none\"/><circle cx=\"843\" cy=\"627\" r=\"4\" fill=\"#e8b04a\"/>\n<text x=\"650\" y=\"790\" fill=\"#e8b04a\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"20\" font-weight=\"700\" letter-spacing=\"1\">MUMBAI \u00b7 STRUCTURE<\/text>\n<text x=\"650\" y=\"814\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Tree columns open into coffers<\/text>\n<text x=\"650\" y=\"835\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">with coloured lenses; a 40 m<\/text>\n<text x=\"650\" y=\"856\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">cantilever over the kerb.<\/text>\n<text x=\"245\" y=\"615\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"15\" font-weight=\"600\" text-anchor=\"middle\">40 m cantilever<\/text>\n<text x=\"110\" y=\"373\" fill=\"#e0bf8f\" font-family=\"Barlow, sans-serif\" font-size=\"14\" font-weight=\"600\">stepwell<\/text>\n<rect x=\"1016\" y=\"110\" width=\"564\" height=\"760\" rx=\"10\" fill=\"#121a1c\" stroke=\"#24302f\"/>\n<text x=\"1040\" y=\"150\" fill=\"#f4c430\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"24\" font-weight=\"700\" letter-spacing=\"1\">THE ROOF IN NUMBERS<\/text>\n<text x=\"1040\" y=\"186\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Roof area, one surface<\/text>\n<text x=\"1040\" y=\"205\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">1.65 million m\u00b2<\/text>\n<text x=\"1040\" y=\"232\" fill=\"#6f7a80\" font-family=\"Barlow, sans-serif\" font-size=\"15\">  Hall \u00b7 Mall \u00b7 piers<\/text>\n<text x=\"1040\" y=\"251\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">680k \u00b7 529k \u00b7 494k m\u00b2<\/text>\n<text x=\"1040\" y=\"278\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Skylight glass<\/text>\n<text x=\"1040\" y=\"297\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">92k m\u00b2 \u00b7 5.6% (estimate)<\/text>\n<text x=\"1040\" y=\"324\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">North-light openings<\/text>\n<text x=\"1040\" y=\"343\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">281 coffers + 204 strips<\/text>\n<text x=\"1040\" y=\"370\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Tree columns<\/text>\n<text x=\"1040\" y=\"389\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">172, 3\u20136 arms each<\/text>\n<text x=\"1040\" y=\"416\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Roof height<\/text>\n<text x=\"1040\" y=\"435\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">Hall 45\u219224 m \u00b7 Mall 26\u201333 m \u00b7 piers 27\u219220 m<\/text>\n<text x=\"1040\" y=\"462\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Gardens<\/text>\n<text x=\"1040\" y=\"481\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">7 valley \u00b7 1 garden valley \u00b7 24 courts<\/text>\n<text x=\"1040\" y=\"508\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Jaali runs<\/text>\n<text x=\"1040\" y=\"527\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">29 on sun-facing walls<\/text>\n<text x=\"1040\" y=\"554\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Oculus<\/text>\n<text x=\"1040\" y=\"573\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">96 m across, over the Zero Mile marker<\/text>\n<text x=\"1040\" y=\"600\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Cantilever<\/text>\n<text x=\"1040\" y=\"619\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">40 m over the kerb and forecourt<\/text>\n<text x=\"1040\" y=\"646\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"15\">Rain to the stepwell<\/text>\n<text x=\"1040\" y=\"665\" fill=\"#ece7da\" font-family=\"Barlow, sans-serif\" font-size=\"16\" font-weight=\"600\">about 1.45 million m\u00b3 a year (estimate)<\/text>\n<text x=\"1040\" y=\"702\" fill=\"#f4c430\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"18\" font-weight=\"700\">Each gateway lobe points home<\/text>\n<text x=\"1040\" y=\"724\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"14\">S to Bengaluru, WSW to Mumbai, WNW to Ahmedabad, each within<\/text>\n<text x=\"1040\" y=\"743\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"14\">8\u00b0. The three axes meet under the oculus.<\/text>\n<text x=\"1040\" y=\"773\" fill=\"#f4c430\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"18\" font-weight=\"700\">North light only<\/text>\n<text x=\"1040\" y=\"795\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"14\">Coffers face north: daylight without direct sun, under a<\/text>\n<text x=\"1040\" y=\"814\" fill=\"#a6afb4\" font-family=\"Barlow, sans-serif\" font-size=\"14\">thick, insulated shell built for 47 \u00b0C afternoons.<\/text>\n<rect x=\"30\" y=\"870\" width=\"38.0\" height=\"5\" fill=\"#ece7da\"/><rect x=\"68.0\" y=\"870\" width=\"38.0\" height=\"5\" fill=\"none\" stroke=\"#ece7da\" stroke-width=\"1.2\"/><text x=\"30\" y=\"864\" fill=\"#a6afb4\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"12\">0<\/text><text x=\"106\" y=\"864\" fill=\"#a6afb4\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"12\" text-anchor=\"middle\">200 m<\/text>\n<path d=\"M1490 830 l-9 24 l9 -6 l9 6 z\" fill=\"#ece7da\"/><text x=\"1490\" y=\"824\" fill=\"#ece7da\" font-family=\"Barlow Condensed, Barlow, sans-serif\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">N<\/text>\n<\/svg><\/div>\n<p class=\"src\">Design references, credited as context, not branding: Mumbai CSMIA Terminal 2 (Skidmore, Owings &amp; Merrill, 2014; Jaya He art programme by Rajeev Sethi); Bengaluru KIA Terminal 2 (Skidmore, Owings &amp; Merrill with Grant Associates and Abu Jani Sandeep Khosla, 2022); Ahmedabad's Sidi Saiyyed jaali, Adalaj and Rani-ki-Vav stepwells, and the pols of the UNESCO-listed walled city. ZMI references ideas and motifs and copies no building, artwork or logo. Planning: ICAO Annex 14 (2018), PANS-ATM, IATA ADRM via TRB, ACRP Report 266. Traffic: GMR Airports Feb 2026 (Delhi, Hyderabad), Aviation A2Z (Mumbai), ACI Asia-Pacific (Bengaluru). The airport is a speculative design; schedules, flight numbers and incidents in the game are modelled. Full sources: design.md.<\/p>\n"};</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const SPEC=JSON.parse(document.getElementById('specData').textContent);
const cv=$('#map'),ctx=cv.getContext('2d');
const wcv=$('#wcv'),wctx=wcv.getContext('2d');
let DPR=1,VW=0,VH=0;

/* ============ helpers ============ */
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const D2R=Math.PI/180;const compA=d=>(d-90)*D2R;
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function pathLen(p){let L=0;for(let i=1;i<p.length;i++)L+=dist(p[i-1].x,p[i-1].y,p[i].x,p[i].y);return L;}
function pointAt(p,d){for(let i=1;i<p.length;i++){const L=dist(p[i-1].x,p[i-1].y,p[i].x,p[i].y);if(d<=L||i===p.length-1){const t=L?clamp(d/L,0,1):1;return{x:lerp(p[i-1].x,p[i].x,t),y:lerp(p[i-1].y,p[i].y,t),a:Math.atan2(p[i].y-p[i-1].y,p[i].x-p[i-1].x)};}d-=L;}return{x:p[0].x,y:p[0].y,a:0};}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const mins=s=>Math.round(s/60);
let SIMR=mulberry(11);
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ============ geometry from the architect's spec ============ */
const EXT=SPEC.extent;
const G=new Map();
const kk=(x,y)=>Math.round(x)+','+Math.round(y);
function gnode(x,y){const k=kk(x,y);let n=G.get(k);if(!n){n={k,x:Math.round(x),y:Math.round(y),out:[]};G.set(k,n);}return n;}
function gedge(a,b,one){if(a===b)return;const d=dist(a.x,a.y,b.x,b.y);if(!a.out.some(e=>e[0]===b.k))a.out.push([b.k,d]);if(!one&&!b.out.some(e=>e[0]===a.k))b.out.push([a.k,d]);}
const TWY=SPEC.taxiways.map(t=>({id:t.id,oneway:!!t.oneway,pts:t.pts.map(p=>({x:p[0],y:p[1]}))}));
(function buildGraph(){
  const segs=[];TWY.forEach((t,ti)=>{for(let i=1;i<t.pts.length;i++)segs.push({a:t.pts[i-1],b:t.pts[i],one:t.oneway,cuts:[]});});
  const verts=[];TWY.forEach(t=>t.pts.forEach(p=>verts.push(p)));
  const extra=[];(SPEC.runways||[]).forEach(r=>{(r.holds||[]).forEach(h=>extra.push({x:h.x,y:h.y}));(r.exits||[]).forEach(e=>extra.push({x:e.to[0],y:e.to[1]}));});
  [...(SPEC.concourses||[]).flatMap(c=>c.gates),...(SPEC.remote||[])].forEach(g=>extra.push({x:g.lane[0],y:g.lane[1]}));
  const pts=verts.concat(extra);
  for(const s of segs){const minx=Math.min(s.a.x,s.b.x)-2,maxx=Math.max(s.a.x,s.b.x)+2,miny=Math.min(s.a.y,s.b.y)-2,maxy=Math.max(s.a.y,s.b.y)+2;const dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,L2=dx*dx+dy*dy;if(!L2)continue;

function mk(o){const f=Object.assign({id:++FID,x:0,y:0,heading:Math.PI,alt:0,v:0,path:null,pd:0,plen:0,prio:false,held:false,trail:[]},o);f.T=TYPES[f.type];f.A=AL[f.al];f.pax=Math.round(f.T.pax*(0.78+SIMR()*0.18));flights.push(f);return f;}

/* ============ glossary ============ */
const GL={
  hub:{t:'You run hub control',d:'This is the airport operations centre of the hub. You decide what each runway does, deal with incidents and protect connections. Air traffic control flies the aircraft. You give it the runways to fly them on.'},
  bank:{t:'Banks and waves',d:'A hub schedules flights in waves. First a bank of arrivals lands within about half an hour, passengers change planes, then a bank of departures leaves. The bank chart at the bottom shows the waves coming. The trick is to give arrivals more runways while they land, then hand runways to departures.'},
  modes:{t:'Runway modes',d:'ARR: arrivals only, about 40 landings an hour. DEP: departures only, about 48 take-offs an hour. MIX: both, alternating, about 25 of each. OFF: closed. Changing a runway\'s mode takes 2 minutes while traffic on it clears.'},
  wake:{t:'Wake turbulence',d:'Wings leave spinning vortices behind them. Heavy jets leave stronger ones, so the aircraft after a 777 or an A380 waits longer. That is why widebodies eat runway capacity.'},
  stack:{t:'Holding stacks',d:'When arrivals come faster than the runways can land them, ATC parks them on racetrack loops in the sky, one above the other, 1,000 ft apart. The lowest leaves first. Holding burns fuel and every minute up there delays connections.'},
  cnx:{t:'Connections',d:'A hub lives on transfers. Each arriving aircraft carries passengers for later departures. If the arrival lands late, or the departure leaves early, they miss it. Domestic transfers need about 26 minutes in this hub, international about 40, because of immigration.'},
  fod:{t:'FOD: foreign object debris',d:'Anything loose on a runway: a bolt, a piece of tyre, a luggage tag. Engines suck it in and tyres burst on it. Air France 4590, the Concorde, was brought down by a metal strip on the runway in 2000. Airside ops sweeps for it in gaps between movements, or while a runway is changing over.'},
  birds:{t:'Bird strikes',d:'Black kites and egrets love the grass beside a runway. The wildlife team patrols all day from the perimeter road, so you only hear about birds when one hits an aircraft. Then there may be remains on the runway: inspect now and lose the runway for a few minutes, or keep going and accept the risk.'},
  ops:{t:'The ops teams have the routine',d:'Amber vehicles on the map are the airport\'s own teams: the wildlife patrol, the runway sweeper and the ramp tugs. They handle routine birds, debris and breakdowns for you, timed around the traffic. Your job is the runways and the few calls that need a duty manager.'},
  fuel:{t:'Minimum fuel and MAYDAY',d:'Aircraft carry fuel to hold for a while, then divert. Minimum fuel means the crew can accept no more delay. If it keeps holding, it declares MAYDAY: an emergency that jumps every queue. Long stacks cause this, so it is really a runway-planning problem.'},
  vvip:{t:'VVIP movements',d:'When a head of state or the Prime Minister flies, protocol closes a runway to all other traffic for a few minutes. You usually get only a few minutes\' warning. Choose the runway whose traffic is easiest to absorb elsewhere.'},
  lights:{t:'Runway edge lights',d:'White lights along both edges of a runway show pilots its width and length at night and in poor visibility. With some out, ATC can still land aircraft but needs more spacing between them.'},
  shear:{t:'Windshear',d:'A sudden change in wind speed or direction close to the ground, common at the gust front of a dust storm. An aircraft on short final can lose lift without warning, so pilots go around rather than risk a hard landing.'},
  heat:{t:'Heat and heavy jets',d:'Hot air is thinner, so wings make less lift and engines less thrust. At 46 °C a full A380 or 777 needs a much longer take-off roll, so it can only use the longest runway.'},
  gate:{t:'Gates, swing gates and remote stands',d:'Contact gates have aerobridges. Swing gates can serve domestic or international flights. Remote stands have no bridge, so passengers ride buses, which adds time.'},
  apm:{t:'APM: automated people mover',d:'The driverless train under the apron that links the central terminal with every concourse. Transfers depend on it.'},
  otp:{t:'On time',d:'The share of flights that ran to schedule. An arrival is on time if it lands within 15 minutes of its scheduled time, so time in the holding stack counts against you. A departure is on time if it is airborne within 25 minutes of its scheduled pushback: 15 minutes of tolerance plus a 10-minute taxi.'},
  dust:{t:'Andhi: dust storm',d:'Pre-monsoon dust storms sweep across central India. Visibility drops fast, crosswinds gust, and ATC widens the gaps between landings.'},
  mix:{t:'Mixed mode',d:'One runway doing both arrivals and departures, slotting a take-off between each pair of landings. Flexible, but each runway handles fewer movements in total than two specialised runways.'}
};
const term=(k,txt)=>`<span class="term" tabindex="0" data-k="${k}">${txt}</span>`;
const coachItems=[];let toastTimer=0;const seen=new Set();
function showToast(t,d){$('#tT').textContent=t;$('#tD').innerHTML=d.startsWith('<')?d:`<p>${d}</p>`;const el=$('#toast');el.hidden=false;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');toastTimer=18;placeToast();}

// some lessons only need teaching once ever, not once per level
function explainOnce(k){const done=store.get('zm_seen')||{};if(done[k]){seen.add(k);return;}done[k]=1;store.set('zm_seen',done);explain(k);}

/* ============ runway logic ============ */
const D_APP=170,SEP_AA=88,SEP_DD=72,MIX_GAP=58,DEP_OCC=55,CHANGE=120;
let dustNow=false,heatNow=false;
const sepF=()=>dustNow?1.4:1;
const canArr=r=>!r.locked&&(r.mode==='ARR'||r.mode==='MIX')&&T>=r.changeUntil&&T>=r.closedUntil&&!r.gapReq;
const blockAt=(r,t,pre)=>r.blocks.some(b=>t>=b.from-(pre||0)&&t<b.to);

const needsLong=f=>heatNow&&f.T.hot&&!f.offloaded;
function setMode(r,m,silent){
  if(r.locked||r.mode===m)return;const was=r.mode;r.mode=m;r.changeUntil=T+CHANGE;S.flips++;
  if(r.degraded){r.degraded=false;r.changeUntil+=120;radio('OPS',`Electricians fixing ${r.short}'s edge lights during the changeover.`);logE(`Edge lights on ${r.short} repaired during a changeover.`);}
  if(r.strike){r.strike=null;logE(`${r.short} inspected for bird remains during the changeover.`);}
  for(const f of flights){if((f.state==='taxi_out'||f.state==='hp')&&f.rwy===r&&!depModeOk(r))assignDep(f,true);}
  if(!silent){radio('AOCC',`Runway ${r.short} ${was} → ${m}. Changeover 2 minutes.`);logE(`Runway ${r.short} set to ${m}.`);}
  renderRw();
}
function rk(f){return(f.mayday?0:f.prio?1:f.minFuel?2:3)*1e7+(f.state==='holding'?f.holdSince:f.eta);}
function gateY(f){if(f.gate)return f.gate.y;if(f.res)return f.res.y;return procC.y;}
function arrSep(r){return (SEP_AA*sepF()+(r.lastArrWake==='J'?55:r.lastArrWake==='H'?25:0))*(r.degraded?1.6:1);}
function runways(){
  // arrivals
  const avail=RW.filter(r=>canArr(r)&&r.status!=='x');
  if(avail.length){
    const cands=flights.filter(f=>(f.state==='holding'||(f.state==='inbound'&&T>=f.eta-D_APP-40))).sort((a,b)=>rk(a)-rk(b));
    const depWaiting=r=>flights.some(f=>f.state==='hp'&&f.rwy===r);
    const ready=avail.filter(r=>{const td=T+D_APP;let need=r.lastSchedTd+arrSep(r);if(r.mode==='MIX'&&depWaiting(r))need+=MIX_GAP;return td>=need&&td>=r.lastDep+DEP_OCC&&!blockAt(r,td,30);});
    for(const c of cands){if(!ready.length)break;
      if(!c.res&&!c.gate){const g=freeGate(c);if(g){g.res=c;c.res=g;}}
      const gy=gateY(c);ready.sort((a,b)=>Math.abs(a.y-gy)-Math.abs(b.y-gy));const r=ready.shift();beginApproach(c,r,T+D_APP);}
  }

    const wk=r.lastDepWake==='J'?90:r.lastDepWake==='H'?30:0;
    if(T<r.lastDep+SEP_DD*(dustNow?1.15:1)+wk)continue;
    if(r.tdList.some(td=>td-T<DEP_OCC&&td-T>-12))continue;
    const q=flights.filter(f=>f.state==='hp'&&f.rwy===r&&!(needsLong(f)&&r!==LONGEST)).sort((a,b)=>(b.prio-a.prio)||(a.hpSince-b.hpSince));if(!q.length)continue;

function assignDep(f,reroute){

  f.noRwy=false;const from=reroute?nearestNode(f.x,f.y).k:f.gate.lane;
  let best=null,bs=1e18,bp=null,bh=null;
  for(const r of opts){const q=flights.filter(o=>(o.state==='hp'||o.state==='taxi_out')&&o.rwy===r).length;for(const h of r.holds){const p=route(from,h);if(!p)continue;const c=pathLen(p)/14+q*75+(r.mode==='MIX'?60:0);if(c<bs){bs=c;best=r;bp=p;bh=h;}}}

  f.rwy=best;f.hold=bh;setPath(f,(reroute?[{x:f.x,y:f.y}]:[]).concat(bp));f.state='taxi_out';return true;

/* ============ flight logic ============ */
function setPath(f,p){f.path=p;f.pd=0;f.plen=pathLen(p);}
function advance(f,dt,v,rev){f.pd=Math.min(f.plen,f.pd+v*dt);const p=pointAt(f.path,f.pd);f.x=p.x;f.y=p.y;const tg=rev?p.a+Math.PI:p.a;f.heading+=angDiff(f.heading,tg)*Math.min(1,dt*1.8);return f.pd>=f.plen-0.01;}
const MOVING=new Set(['rollout','taxi_in','taxi_out','hp','push','start','lineup','nogate','tow','stuck']);
let movingList=[];
function blocked(f){const hx=Math.cos(f.heading),hy=Math.sin(f.heading);const lim=Math.max(70,f.T.len*1.9);for(const o of movingList){if(o===f)continue;const dx=o.x-f.x,dy=o.y-f.y;if(Math.abs(dx)>lim||Math.abs(dy)>lim)continue;const d=Math.hypot(dx,dy);if(d>lim||d<1)continue;if((dx*hx+dy*hy)/d<0.9)continue;if(o.state!=='stuck'&&o.state!=='nogate'&&o.state!=='hp'&&Math.abs(angDiff(f.heading,o.heading))>1.3)continue;return true;}return false;}
function stackOf(f){return STACKS[Math.min(STACKS.length-1,DIRSTACK[f.dir]??1)];}
function spawnInbound(f){const st=stackOf(f);const a=Math.atan2(st.y-0,st.x-0);const sx=st.x+Math.cos(a)*9000+(SIMR()-0.5)*4000,sy=st.y+Math.sin(a)*9000+(SIMR()-0.5)*4000;f.x=sx;f.y=sy;f.alt=2400;setPath(f,[{x:sx,y:sy},{x:st.x,y:st.y}]);f.state='inbound';f.heading=Math.atan2(st.y-sy,st.x-sx);f.stack=st;}
function beginApproach(f,r,td){
  f.state='approach';f.rwy=r;f.apT0=T;f.td=td;const faf={x:r.x1+7000,y:r.y},tdp={x:r.x1-450,y:r.y};

  setPath(f,[{x:f.x,y:f.y},mid,faf,tdp]);f.finalLen=7450;f.finalStart=f.plen-f.finalLen;f.startAlt=f.alt||1500;

}
function goAround(f,why){const r=f.rwy;r.tdList=r.tdList.filter(t=>t!==f.td);f.state='goaround';f.td=null;const st=stackOf(f);setPath(f,[{x:f.x,y:f.y},{x:r.x0-1500,y:r.y},{x:r.x0-3000,y:r.y+(r.y<0?-3000:3000)},{x:st.x,y:st.y}]);S.goArounds++;radio('TWR',`${cs(f)}, go around, ${why}.`);}
function touchdown(f){
  const r=f.rwy;f.state='rollout';f.alt=0;f.v=68;
  if(f.medSince!=null){const w=(T-f.medSince)/60;if(w>8)hitSafety(4,`The medical on ${fl(f)} waited ${Math.round(w)} min to land.`);else logE(`${fl(f)} landed its medical after ${Math.round(w)} min.`);f.medSince=null;}r.occ=f;r.tdList=r.tdList.filter(t=>t!==f.td);r.ops++;S.moves++;S.arr++;moveLog.push(T);f.landT=T;if(T-f.origEta<=900)S.arrOnTime++;
  const need=f.T.code==='F'?2200:f.T.code==='E'?1900:1300;const tx=r.x1-450;let ex=r.exits.find(e=>tx-e.x>=need)||r.exits[r.exits.length-1];

function startTaxiIn(f){
  if(!f.res&&!f.gate){const g=freeGate(f);if(g){g.res=f;f.res=g;}}
  if(f.res){const p=route(f.exitNode,f.res.lane);if(p){setPath(f,[{x:f.x,y:f.y}].concat(p));f.state='taxi_in';return;}}

}
function depart(f){f.state='gone';const late=(f.rollT-f.std)/60;S.moves++;S.dep++;moveLog.push(f.rollT);if(late<=25)S.depOnTime++;S.delaySum+=Math.max(0,late-10);}
function settleLinks(f){if(!f.links)return;for(const l of f.links){const ok=l.arr.inBlock!=null&&l.arr.inBlock+l.x+(l.arr.gate&&l.arr.gate.remote?300:0)<=f.pushT+(f.heldFor||0);if(ok)S.cnxMade+=l.n;else S.cnxMiss+=l.n;}f.links=null;}
function laneClear(g){const L=G.get(g.lane);for(const o of movingList){if(o.gate===g)continue;if(Math.abs(o.x-L.x)<130&&Math.abs(o.y-L.y)<130)return false;}return true;}

  case 'parked':if(T>=f.towAt&&laneClear(f.gate)){const g=f.gate;const p=route(g.lane,PARK);g.occ=null;f.state='tow';setPath(f,[{x:g.x,y:g.y}].concat(p||[]));f.gate=null;}break;

    break;}
  case 'push':if(advance(f,dt,3.5,true)){f.state='start';f.startT=T;}break;

/* ============ ops teams: routine airside work happens without you ============ */
// A real duty manager doesn't dispatch every bird patrol or sweeper: the wildlife unit and airside ops get on with it.
// You see their vehicles on the map and a line on the radio. Nothing to click, and they work around the traffic.

function opsSpawn(kind,target){
  if(kind==='tug'){const f=target||flights.filter(o=>o.state==='taxi_out'&&o.pd>400&&o.plen-o.pd>800).sort(()=>SIMR()-0.5)[0];if(!f)return false;
    f.stuckPrev='taxi_out';f.state='stuck';f.stuckUntil=T+210;const a=f.heading;ops.push({id:++OPN,kind,f,t0:T,dur:210,sx:f.x-Math.cos(a)*700,sy:f.y-Math.sin(a)*700});

    if(ops.filter(o=>o.kind==='birds').length===1)radio('WILDLIFE',`Kites over the grass by ${r.short}. Patrol on the way. No effect on the runway.`);explainOnce('ops');return true;}
  if(kind==='fod'){if(ops.some(o=>o.kind==='fod'&&o.r===r))return false;ops.push({id:++OPN,kind,r,x:lerp(r.x0,r.x1,0.3+SIMR()*0.5),t0:T,phase:'wait'});

  return false;
}
function opsTick(dt){
  for(let i=ops.length-1;i>=0;i--){const o=ops[i];
    if(o.kind!=='fod'){if(T>=o.t0+o.dur)ops.splice(i,1);continue;}
    const r=o.r;if(r.locked){r.gapReq=false;ops.splice(i,1);continue;}
    if(o.phase==='wait'){
      const quiet=r.mode==='OFF'||T<r.changeUntil||T<r.closedUntil;
      const busy=r.occ||r.tdList.some(td=>td>T-5&&td<T+OPSW+30)||flights.some(f=>f.rwy===r&&(f.state==='lineup'||(f.state==='roll'&&f.alt<60)));

        radio('OPS',quiet?`Sweeping ${r.short} while it is out of use. No time lost.`:`Sweeping ${r.short} in a gap. Back in ${OPSW} seconds.`);}
      else if(T-o.t0>300&&!r.gapReq){r.gapReq=true;radio('TWR',`Making a gap on ${r.short} for the sweeper.`);}
    }else if(T>=o.ts+OPSW){logE(`Runway ${r.short} swept${o.free?' while out of use':' in a gap'}.`);ops.splice(i,1);}

}

    <p>Ahmedabad (SVPIA), Mumbai (CSMIA) and Bengaluru (KIA) close and merge into one airport near Nagpur's Zero Mile, long held to mark the centre of India. You run it. It is sized for the combined traffic of Delhi, Mumbai, Bengaluru and Hyderabad: about 3,630 movements and 209 million passengers a year, 1.7 times Atlanta. The airlines move in one city at a time, and the waves get taller.</p>
    <div class="levels">${lv}</div>
    <div class="cfgrow"><b>Incidents</b><div class="seg2" role="group" aria-label="Incidents"><button data-inc="std" class="${CFG.inc!=='off'?'on':''}">Standard</button><button data-inc="off" class="${CFG.inc==='off'?'on':''}">Off: runways only</button></div><small>${CFG.inc==='off'?'Just you, the bank chart and the runways. Fuel emergencies still happen if the stack grows.':'A few real calls per level. The ops teams handle the routine.'}</small></div>
    <h2>How to play</h2>
    <ul>
     <li><b>The bank chart</b> at the bottom is your radar for the next hour. Purple bars are arrivals due, teal bars are departures due, dashed lines are what your runways can handle. When the bars poke above the line, you are about to fall behind.</li>
     <li><b>The runway desk</b> (or click a runway on the map) sets each runway to ARR, DEP, MIX or OFF. A switch takes 2 minutes. Move runways to arrivals before an arrival bank, then to departures before the departure bank.</li>
     <li><b>Calls</b> pop up on the map with a countdown ring when something needs a duty manager, only a few per level. Each card says what ops will do if you leave it. Routine birds, debris and breakdowns are handled by the ops teams: the amber vehicles on the map.</li>
     <li>Click any aircraft to see where it is going, prioritise it or hold it at the gate. <span class="kbd">Space</span> pauses, <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> change speed. Wheel or pinch to zoom.</li>
    </ul>
   </div>
   <div id="tPlan" ${tab==='plan'?'':'hidden'}>
    <h1>${SPEC.name}</h1><p>${SPEC.tagline||''}</p>
    <div class="plan">${planSvg}</div>
    ${D.html||''}
   </div>
  </div>`;
  $('#overlay').hidden=false;
  $('#sheet').querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>menu(b.dataset.t));
  $('#sheet').querySelectorAll('.lc').forEach(b=>b.onclick=()=>startLevel(+b.dataset.n));
  $('#sheet').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{CFG.inc=b.dataset.inc;store.set('zm_cfg',CFG);menu('levels');});
}
window.HUB={get T(){return T;},get S(){return S;},get LV(){return LV;},flights:()=>flights,RW,incidents:()=>incidents,setMode:(id,m)=>{const r=RW.find(x=>x.id===id||x.short===id);if(r)setMode(r,m);},startLevel,capNow,resolveAll:()=>{for(const I of incidents.slice()){const a=I.acts.find(a=>!(a.dis&&a.dis()));if(a)a.fn();}},speed:s=>setSpeed(s),ops:()=>ops,cfg:CFG,
  // test hooks: run the sim forward synchronously, and point the camera
  ff:secs=>{for(let i=0;i<secs&&!ended;i++)tick(1);puffs.length=0;hud();drawWave();},look:(x,y,z)=>{camT.s=cam.fit*z;camT.anchor=null;camT.x=x-((cam.region.L+cam.region.R)/2)/camT.s;camT.y=y-((cam.region.Tp+cam.region.B)/2)/camT.s;clampCam(camT);Object.assign(cam,{x:camT.x,y:camT.y,s:camT.s});},spawn:(t,x)=>spawnInc(t,x),opsSpawn:(k,x)=>opsSpawn(k,x),pause:()=>{paused=true;}};

/* ============ boot ============ */
buildTerrain();resize();
let last=performance.now(),hudT=0;
function frame(ms){
  requestAnimationFrame(frame);
  if(cv.clientWidth&&(cv.clientWidth!==VW||cv.clientHeight!==VH))resize();
  const dtR=Math.min(0.1,(ms-last)/1000);last=ms;camEase(dtR);
  if(running&&!paused&&!ended){let d=dtR*BASE*speed;try{while(d>0){const st=Math.min(1,d);tick(st);d-=st;}}catch(err){console.error(err);}incTick(dtR);if(toastTimer>0){toastTimer-=dtR;if(toastTimer<=0&&!$('#toast').matches(':hover'))$('#toast').hidden=true;}}
  try{draw(ms/1000);}catch(err){console.error(err);}
  hudT+=dtR;if(hudT>0.25&&LV){hudT=0;try{hud();}catch(err){console.error(err);}try{drawWave();}catch(err){console.error(err);}}
}
// idle preview: show level 4's layout behind the menu
LV=LEVELS[3];RW.forEach(r=>{r.locked=false;r.mode=r.role==='arr'?'ARR':r.role==='dep'?'DEP':'MIX';});resetState();
menu('levels');
requestAnimationFrame(frame);
})();
